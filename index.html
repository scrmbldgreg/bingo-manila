<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Manila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root { --london-blue: #002147; --royal-red: #991b1b; }
    .bg-london-blue { background-color: var(--london-blue); }
    .text-london-blue { color: var(--london-blue); }
    .bg-royal-red { background-color: var(--royal-red); }
    .marked { position: relative; background-color: #10b981 !important; color: white !important; }
    .marked::after { content: '✖'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.4); font-size: 1.5rem; }
    .winning-cell { position: relative; background-color: #fef08a !important; color: #854d0e !important; }
    .winning-cell::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background-color: var(--royal-red); transform: translateY(-50%); z-index: 10; pointer-events: none; }
    #historyBox::-webkit-scrollbar { width: 6px; }
    #historyBox::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 font-sans text-slate-900">

  <div class="flex flex-col items-center mb-8">
    <div class="w-32 h-32 rounded-full border-4 border-white shadow-lg flex items-center justify-center overflow-hidden mb-2">
      <img src="https://scrmbldgreg.github.io/bingo-manila/assets/bigbenmnl.png" alt="Big Ben Manila Logo" class="w-full h-full object-contain p-2">
    </div>
    <h1 class="text-2xl font-black tracking-tighter text-london-blue uppercase">Big Ben Manila Bingo</h1>
  </div>

  <div id="screenInitial" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md flex flex-col gap-4 text-center border-t-8 border-london-blue">
    <button onclick="showScreen('screenCreate')" class="bg-london-blue hover:opacity-90 text-white font-bold py-4 rounded-2xl transition">CREATE LOBBY</button>
    <button onclick="showScreen('screenJoin')" class="bg-royal-red hover:opacity-90 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-red-200">JOIN LOBBY</button>
  </div>

  <div id="screenCreate" class="hidden bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-t-8 border-london-blue">
    <h2 class="text-xl font-bold mb-4 text-london-blue">Host a Game</h2>
    <input id="hostName" type="text" placeholder="Your Name" class="border-2 rounded-xl p-3 w-full mb-4 outline-none focus:border-london-blue">
    <button onclick="handleCreateLobby()" class="bg-london-blue text-white font-bold py-3 rounded-xl w-full uppercase">Generate Lobby</button>
    <button onclick="showScreen('screenInitial')" class="text-slate-400 mt-4 w-full text-sm hover:underline text-center">← Cancel</button>
  </div>

  <div id="screenJoin" class="hidden bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-t-8 border-royal-red">
    <h2 class="text-xl font-bold mb-4 text-royal-red">Join Room</h2>
    <input id="playerName" type="text" placeholder="Your Name" class="border-2 rounded-xl p-3 w-full mb-3 outline-none focus:border-royal-red">
    <input id="joinCode" type="text" placeholder="Room Code" class="border-2 rounded-xl p-3 w-full mb-4 outline-none uppercase tracking-widest text-center font-bold">
    <button onclick="handleJoinLobby()" class="bg-royal-red text-white font-bold py-3 rounded-xl w-full uppercase">Enter Room</button>
    <button onclick="showScreen('screenInitial')" class="text-slate-400 mt-4 w-full text-sm hover:underline text-center">← Cancel</button>
  </div>

  <div id="screenLobbyRoom" class="hidden bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg border-x-8 border-london-blue">
    <div class="text-center mb-6">
      <span class="text-slate-400 uppercase text-xs font-bold tracking-widest">Share this Code</span>
      <div id="displayCode" class="text-6xl font-black text-london-blue mt-1">XXXXX</div>
    </div>
    <div class="flex flex-col items-center gap-2 mt-4 mb-4">
      <button onclick="copyInviteLink()" class="bg-slate-100 hover:bg-slate-200 text-london-blue text-[10px] font-bold py-2 px-4 rounded-full transition flex items-center gap-2">
        <span id="shareBtnText">COPY INVITE LINK</span>
      </button>
    </div>
    <div class="bg-slate-50 rounded-2xl p-4 mb-6">
      <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        Waiting for Players...
      </h3>
      <ul id="playerList" class="space-y-2"></ul>
    </div>
    <button onclick="enterGamePanel()" class="bg-london-blue text-white font-bold py-4 rounded-2xl w-full shadow-xl hover:scale-[1.02] transition">ENTER GAME PANEL</button>
  </div>

  <div id="gameArea" class="hidden w-full max-w-6xl flex flex-col gap-6">
    <div class="grid lg:grid-cols-4 gap-6">
      <div class="lg:col-span-3 space-y-6">
        <div class="grid md:grid-cols-3 gap-6">
          <div class="bg-white p-6 rounded-3xl shadow-lg flex flex-col border-t-8 border-london-blue">
            <div class="text-center mb-4">
              <h3 class="font-bold text-slate-400 text-[10px] mb-1 uppercase tracking-widest">Now Calling</h3>
              <div id="bingoCurrent" class="text-6xl font-black text-london-blue leading-tight">-</div>
            </div>
            <div class="flex-1 flex flex-col border-t border-slate-100 pt-4">
              <h3 class="font-bold text-slate-400 text-[10px] mb-3 uppercase tracking-widest">Full History</h3>
              <div id="historyBox" class="text-[18px] text-slate-500 h-80 overflow-y-auto pr-2 font-mono flex flex-wrap gap-2 content-start scroll-smooth"></div>
            </div>
          </div>
          <div id="cardWrapper" class="md:col-span-2 p-6 rounded-3xl shadow-2xl transition-all border-london-blue border-8 overflow-hidden">
            <div class="flex justify-between items-center mb-6 text-white">
              <div class="flex flex-col">
                <h2 id="cardOwnerName" class="text-2xl font-black uppercase italic tracking-tighter">Your Card</h2>
                <span class="text-[10px] opacity-75 uppercase font-bold">Big Ben Manila</span>
              </div>
              <div class="flex gap-2">
                <button onclick="downloadCard()" class="bg-green-600 text-white px-3 py-2 rounded-xl font-bold text-xs shadow-xl active:scale-95 transition">DOWNLOAD</button>
                <button id="btnNewCard" onclick="generateCard()" class="bg-white text-london-blue px-3 py-2 rounded-xl font-bold text-xs shadow-xl active:scale-95 transition">REFRESH</button>
              </div>
            </div>
            <div class="flex justify-center overflow-x-auto pb-4">
              <table id="bingoCard" class="border-separate border-spacing-2">
                <thead class="text-white font-black text-3xl">
                  <tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>
                </thead>
                <tbody class="bg-white rounded-2xl overflow-hidden"></tbody>
              </table>
            </div>
          </div> 
        </div>
      </div>
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-md border-b-4 border-slate-200">
          <div class="mb-4 text-center">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Room Code</span>
            <div id="gameRoomCode" class="text-2xl font-black text-london-blue tracking-widest">XXXXX</div>
          </div>
          <div class="flex flex-col items-center gap-2 mt-4 mb-4">
            <button onclick="copyInviteLink()" class="bg-slate-100 hover:bg-slate-200 text-london-blue text-[10px] font-bold py-2 px-4 rounded-full transition flex items-center gap-2">
              <span id="shareBtnText">COPY INVITE LINK</span>
            </button>
            <button onclick="leaveRoom()" class="w-full mt-4 text-slate-400 hover:text-royal-red text-[10px] font-bold uppercase tracking-widest transition border-t pt-4">
              Leave Room
            </button>
          </div>
          <h3 class="font-bold text-slate-400 text-xs uppercase mb-4 tracking-widest border-t pt-4">Players</h3>
          <ul id="gamePlayerList" class="space-y-2"></ul>
          <div id="jackpotStatus" class="mt-4 text-center p-2 bg-royal-red text-white rounded-lg text-xs font-bold hidden animate-bounce">BLACKOUT MODE</div>
        </div>
        <div id="hostControlsPanel" class="hidden bg-london-blue p-6 rounded-3xl shadow-xl text-white space-y-3">
          <button id="btnStartGame" onclick="triggerStartGame()" class="w-full bg-royal-red text-white font-bold py-3 rounded-xl shadow-lg transition">START GAME</button>
          <div id="activeHostButtons" class="hidden space-y-3">
            <button onclick="callNumber()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-inner active:scale-95 transition">CALL NUMBER</button>
            <button onclick="toggleJackpotMode()" id="jackpotBtn" class="w-full border-2 border-white/30 hover:bg-white/10 py-2 rounded-xl text-sm font-bold transition uppercase">BLACKOUT</button>
          </div>
          <button onclick="resetBingo()" class="w-full text-white/50 text-[10px] font-bold pt-2 uppercase">RESET GAME STATE</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="mt-16 mb-12 flex flex-col items-center gap-6 opacity-60">
    <div class="h-px w-32 bg-slate-300"></div>
    <div class="flex items-center gap-3">
      <img src="https://scrmbldgreg.github.io/bingo-manila/assets/gemini-ai-logo.png" alt="Gemini Logo" class="w-6 h-6 animate-pulse">
      <p class="text-[10px] font-bold tracking-[0.2em] text-london-blue uppercase">Powered by Gemini AI</p>
    </div>
    <img src="https://scrmbldgreg.github.io/bingo-manila/assets/scrmbldgreg.png" alt="SCRMBLDGREG Logo" class="h-8 object-contain">
    <p class="text-[9px] font-medium text-slate-400 tracking-wider uppercase">&copy; 2026 Big Ben Manila</p>
  </footer>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBznF9jfkpSnKigpMnM706dXL_ZMOjUOAw",
  authDomain: "bingo-manila.firebaseapp.com",
  databaseURL: "https://bingo-manila-default-rtdb.firebaseio.com", 
  projectId: "bingo-manila",
  storageBucket: "bingo-manila.firebasestorage.app",
  messagingSenderId: "792321653174",
  appId: "1:792321653174:web:1cf7c925f055b7134f6917",
  measurementId: "G-4Q004H7XWG"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= GLOBAL STATE ================= */
let currentLobby = null, myName = null, isHost = false;
let gameNumbersPool = [], calledNumbers = [], isJackpotMode = false, gameStarted = false;

/* ================= NAVIGATION & SESSION ================= */
function showScreen(id) {
  ['screenInitial', 'screenCreate', 'screenJoin', 'screenLobbyRoom', 'gameArea'].forEach(s => 
    document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// 1. SESSION RECOVERY ON LOAD
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const roomFromUrl = params.get('room');
  const savedSession = localStorage.getItem('bingo_session');

  if (savedSession) {
    const session = JSON.parse(savedSession);
    const snapshot = await db.ref('lobbies/' + session.lobby).get();
    
    if (snapshot.exists()) {
      const data = snapshot.val();
      currentLobby = session.lobby;
      myName = session.name;
      
      // CRITICAL: Verify if this user is the Host stored in Firebase
      isHost = (data.host === myName);
      
      if (isHost) {
        // Re-establish Host Presence and Disconnect Protection
        db.ref(`lobbies/${currentLobby}/hostActive`).set(true);
        db.ref(`lobbies/${currentLobby}`).onDisconnect().remove();
      }

      setupLobby();
      
      // Auto-jump to Game Area if game is already active
      if (data.gameState && data.gameState.gameStarted) {
          setTimeout(enterGamePanel, 500);
      }
    } else {
      localStorage.removeItem('bingo_session');
    }
  } else if (roomFromUrl) {
    showScreen('screenJoin');
    document.getElementById('joinCode').value = roomFromUrl.toUpperCase();
    document.getElementById('playerName').focus();
  }
});

/* ================= CLOUD LOGIC ================= */

async function handleCreateLobby() {
  const name = document.getElementById('hostName').value.trim();
  if (!name) return alert("Please enter your name");
  const code = Math.random().toString(36).substring(2, 7).toUpperCase();
  currentLobby = code; myName = name; isHost = true;

  const lobbyRef = db.ref('lobbies/' + code);
  await lobbyRef.set({
    host: name, 
    players: [name],
    hostActive: true,
    gameState: { calledNumbers: [], isJackpotMode: false, gameStarted: false, winners: [], lastNum: '-' }
  });

  lobbyRef.onDisconnect().remove();
  setupLobby();
}

async function handleJoinLobby() {
  const nameInput = document.getElementById('playerName');
  const codeInput = document.getElementById('joinCode');
  const name = nameInput.value.trim();
  const code = codeInput.value.trim().toUpperCase();
  
  if (!name || !code) return alert("Enter name and code");

  const snapshot = await db.ref('lobbies/' + code).get();
  if (!snapshot.exists()) return alert("Room not found");

  const data = snapshot.val();
  const existingPlayers = data.players || [];
  const nameExists = existingPlayers.some(p => p.toLowerCase() === name.toLowerCase());

  if (nameExists) return alert(`The name "${name}" is already taken.`);

  existingPlayers.push(name);
  await db.ref('lobbies/' + code + '/players').set(existingPlayers);
  
  currentLobby = code; myName = name; isHost = false;
  setupLobby();
}

function setupLobby() {
  // Save credentials to storage
  localStorage.setItem('bingo_session', JSON.stringify({ lobby: currentLobby, name: myName, isHost: isHost }));
  
  document.getElementById('displayCode').textContent = currentLobby;
  showScreen('screenLobbyRoom');

  db.ref('lobbies/' + currentLobby).on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      alert("The session has ended.");
      localStorage.removeItem('bingo_session');
      location.href = window.location.pathname; 
      return;
    }
    
    // Sync pool and state for Host Re-entry
    gameStarted = data.gameState.gameStarted;
    calledNumbers = data.gameState.calledNumbers || [];
    isJackpotMode = data.gameState.isJackpotMode;

    updatePlayerUI(data.players, data.host, data.gameState.winners || []);
    render(data.gameState);
  });
}

/* ================= GAME ACTIONS ================= */

function enterGamePanel() {
  showScreen('gameArea');
  document.getElementById('gameRoomCode').textContent = currentLobby;
  
  const hostPanel = document.getElementById('hostControlsPanel');
  if (isHost) {
    hostPanel.classList.remove('hidden');
    // Reconstruct the number pool based on what was already called
    const flatCalled = calledNumbers.map(n => parseInt(n.split('-')[1]));
    gameNumbersPool = Array.from({length: 75}, (_, i) => i + 1).filter(n => !flatCalled.includes(n));
    
    // UI fix for host re-entry
    if (gameStarted) {
       document.getElementById('btnStartGame').classList.add('hidden');
       document.getElementById('activeHostButtons').classList.remove('hidden');
    }
  } else {
    hostPanel.classList.add('hidden');
  }
  generateCard();
}

function triggerStartGame() {
  if (!confirm("Start game?")) return;
  db.ref('lobbies/' + currentLobby + '/gameState').update({ gameStarted: true, winners: [], calledNumbers: [], lastNum: '-' });
  document.getElementById('btnStartGame').classList.add('hidden');
  document.getElementById('activeHostButtons').classList.remove('hidden');
}

function callNumber() {
  if (gameNumbersPool.length === 0) return alert("All numbers called!");
  const idx = Math.floor(Math.random() * gameNumbersPool.length);
  const num = gameNumbersPool.splice(idx, 1)[0];
  const label = (num<=15?'B':num<=30?'I':num<=45?'N':num<=60?'G':'O') + "-" + num;
  calledNumbers.push(label);
  db.ref('lobbies/' + currentLobby + '/gameState').update({ calledNumbers, lastNum: label });
}

function toggleJackpotMode() {
  db.ref('lobbies/' + currentLobby + '/gameState').update({ isJackpotMode: !isJackpotMode });
}

async function leaveRoom() {
  if (!confirm(isHost ? "End session for all?" : "Leave room?")) return;
  if (isHost) await db.ref(`lobbies/${currentLobby}`).remove();
  else {
    const snapshot = await db.ref(`lobbies/${currentLobby}/players`).get();
    let players = (snapshot.val() || []).filter(p => p !== myName);
    await db.ref(`lobbies/${currentLobby}/players`).set(players);
  }
  localStorage.removeItem('bingo_session');
  location.href = window.location.pathname;
}

/* ================= UI & WIN LOGIC ================= */

function render(state) {
  const lastNum = state.lastNum || '-';
  document.getElementById('bingoCurrent').textContent = lastNum;
  
  const historyBox = document.getElementById('historyBox');
  const nums = state.calledNumbers || [];
  
  historyBox.innerHTML = nums.map(n => {
    const isLast = (n === lastNum);
    return `<span class="${isLast ? 'bg-royal-red text-white scale-110 shadow-md ring-2 ring-red-300' : 'bg-slate-100 text-slate-800'} px-3 py-1 rounded-lg border font-bold transition-all duration-300 transform">${n}</span>`;
  }).join('');
  
  historyBox.scrollTop = historyBox.scrollHeight;

  const btn = document.getElementById('btnNewCard');
  if (state.gameStarted) {
    btn.disabled = true;
    btn.className = "bg-slate-200 text-slate-400 px-3 py-2 rounded-xl font-bold text-xs cursor-not-allowed";
    btn.textContent = "LOCKED";
  } else {
    btn.disabled = false;
    btn.className = "bg-white text-london-blue px-3 py-2 rounded-xl font-bold text-xs shadow-xl transition";
    btn.textContent = "REFRESH";
    clearCardMarksUI();
  }
  document.getElementById('jackpotStatus').classList.toggle('hidden', !state.isJackpotMode);
  document.getElementById('jackpotBtn').textContent = state.isJackpotMode ? "CLASSIC BINGO" : "BLACKOUT";
}

function checkWin() {
  const board = Array.from(document.querySelectorAll('#bingoCard tr')).slice(1).map(tr => Array.from(tr.querySelectorAll('td')));
  const isMarked = (td) => td.classList.contains('marked');
  let winningCells = [];

  if (isJackpotMode) {
    const allCells = board.flat();
    if (allCells.every(isMarked)) winningCells = allCells;
  } else {
    for (let i = 0; i < 5; i++) {
      if (board[i].every(isMarked)) winningCells = board[i];
      const col = board.map(row => row[i]);
      if (col.every(isMarked)) winningCells = col;
    }
    const d1 = [board[0][0], board[1][1], board[2][2], board[3][3], board[4][4]];
    const d2 = [board[0][4], board[1][3], board[2][2], board[3][1], board[4][0]];
    if (d1.every(isMarked)) winningCells = d1;
    if (d2.every(isMarked)) winningCells = d2;
  }

  if (winningCells.length > 0) {
    winningCells.forEach(td => td.classList.add('winning-cell'));
    announceWin();
  }
}

async function announceWin() {
  const snapshot = await db.ref('lobbies/' + currentLobby + '/gameState/winners').get();
  let winners = snapshot.val() || [];
  if (!winners.includes(myName)) {
    winners.push(myName);
    await db.ref('lobbies/' + currentLobby + '/gameState/winners').set(winners);
  }
}

function updatePlayerUI(players, hostName, winnerList) {
  const lobbyList = document.getElementById('playerList');
  if (lobbyList) {
    lobbyList.innerHTML = players.map(p => `
      <li class="p-3 bg-white rounded-xl border-2 border-slate-100 flex justify-between items-center text-sm">
        <span class="font-bold text-slate-700">${p}</span>
        ${p === hostName ? '<span class="bg-london-blue text-[8px] text-white px-2 py-1 rounded-full font-black">HOST</span>' : ''}
      </li>`).join('');
  }

  const gameList = document.getElementById('gamePlayerList');
  gameList.innerHTML = players.map(p => {
    const isWinner = winnerList.includes(p);
    const kickBtn = (isHost && p !== myName) ? `<button onclick="kickPlayer('${p}')" class="ml-2 text-royal-red font-bold text-[8px] uppercase border px-2 py-1 rounded-md">Kick</button>` : '';
    return `
      <li class="flex items-center justify-between p-3 rounded-xl border-2 transition-all ${isWinner ? 'bg-yellow-50 border-yellow-400 shadow-lg' : 'bg-slate-50 border-slate-100'}">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full ${isWinner ? 'bg-yellow-500 animate-pulse' : 'bg-green-500'}"></div>
          <span class="text-sm font-bold ${isWinner ? 'text-yellow-900' : 'text-slate-700'}">${p}</span>
        </div>
        <div class="flex items-center gap-2">${isWinner ? '<span class="text-[9px] bg-yellow-500 text-white px-2 py-0.5 rounded-full font-black uppercase">WINNER</span>' : ''}${kickBtn}</div>
      </li>`;
  }).join('');
}

function clearCardMarksUI() {
  document.querySelectorAll('#bingoCard td').forEach(td => {
    td.classList.remove('winning-cell', 'marked');
    if (td.textContent === "FREE") td.classList.add('marked');
  });
}

function generateCard() {
  const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  const cols = ranges.map(r => Array.from({length: 15}, (_,i)=>i+r[0]).sort(()=>Math.random()-0.5).slice(0,5));
  const tbody = document.querySelector('#bingoCard tbody');
  tbody.innerHTML = '';
  document.getElementById('cardOwnerName').textContent = myName ? `${myName}` : "Your Card";
  const brandColors = ['#002147', '#b91c1c'];
  document.getElementById('cardWrapper').style.backgroundColor = brandColors[Math.floor(Math.random() * 2)];

  for (let r=0; r<5; r++) {
    const tr = document.createElement('tr');
    for (let c=0; c<5; c++) {
      const td = document.createElement('td');
      td.className = "w-14 h-14 md:w-20 md:h-20 bg-white border-2 border-slate-200 text-xl font-black cursor-pointer text-center text-london-blue shadow-inner transition-colors";
      const val = cols[c][r];
      const label = (val<=15?'B':val<=30?'I':val<=45?'N':val<=60?'G':'O') + "-" + val;
      if (r===2 && c===2) { 
        td.textContent="FREE"; td.classList.add('bg-royal-red', 'marked', 'text-white', 'text-[10px]'); 
      } else { 
        td.textContent = val; td.dataset.label = label; 
        td.onclick = () => { if (calledNumbers.includes(label)) { td.classList.toggle('marked'); checkWin(); } else { alert("Number not drawn yet!"); } };
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

async function downloadCard() {
  const element = document.getElementById('cardWrapper');
  const canvas = await html2canvas(element, { scale: 2, useCORS: true });
  const link = document.createElement('a');
  link.download = `${myName}-BigBen.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function copyInviteLink() {
  const url = `${window.location.origin}${window.location.pathname}?room=${currentLobby}`;
  navigator.clipboard.writeText(url).then(() => {
    const btnText = document.getElementById('shareBtnText');
    btnText.textContent = "LINK COPIED!";
